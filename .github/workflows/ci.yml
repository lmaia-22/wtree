name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck wtree.sh shell/wtree.bash

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
      - run: shfmt -d wtree.sh shell/wtree.bash

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Install gh
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install gh
          else
            sudo apt-get update
            sudo apt-get install -y gh zsh
          fi
      - name: zsh syntax check
        run: zsh -n shell/wtree.zsh
      - run: bats test/
